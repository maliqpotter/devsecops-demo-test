name: CD - Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "todo-python"

jobs:
  build_and_scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # Load into local docker daemon
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy Image Scan (Local)
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Run App for DAST
        run: |
          docker run -d -p 8000:8000 --name todo-app ${{ env.IMAGE_NAME }}:latest
          # Wait for app to be ready
          timeout 60s bash -c "until curl -s localhost:8000/ > /dev/null; do sleep 2; done"

      - name: Run ZAP Baseline Scan (Against Local App)
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false
