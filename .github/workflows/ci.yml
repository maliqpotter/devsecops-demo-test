name: CI - Security Scan

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  lint_and_test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx -r requirements.txt
      - name: Run Ruff (Linter)
        run: ruff check .
      - name: Run pytest with coverage
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=xml

  sast_bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: [lint_and_test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r app -f json -o bandit-report.json

  sca_pip_audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: [lint_and_test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --strict --format json > pip-audit.json

  secret_scan_gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: [lint_and_test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
